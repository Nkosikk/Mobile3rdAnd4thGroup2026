name: Mobile CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress verify

  android-test:
    name: Android UI test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium
        run: |
          npm install --global appium@2.19.0
          appium driver install uiautomator2@3.9.2

      - name: Run test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            appium --log appium.log >/dev/null 2>&1 &
            APPIUM_PID=$!
            trap 'kill "$APPIUM_PID"' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:4723/status >/dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail --silent http://127.0.0.1:4723/status >/dev/null
            mvn --batch-mode --no-transfer-progress -Dtest=basicTests.NotInstalledApp test

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-diagnostics
          path: |
            appium.log
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
